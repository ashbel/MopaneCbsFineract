apiVersion: 1

groups:
  - orgId: 1
    name: fineract-ops
    folder: Fineract
    interval: 1m
    rules:
      - uid: fineract_container_down
        title: FineractContainerDown
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A Fineract container is missing
          description: "One of fineract-legacy-app / mysql / ui has no cAdvisor series."
        labels:
          severity: critical
          service: fineract
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: absent(container_memory_working_set_bytes{name="fineract-legacy-app"})
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: absent(container_memory_working_set_bytes{name="fineract-legacy-mysql"})
              instant: true
              refId: B
          - refId: D
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: absent(container_memory_working_set_bytes{name="fineract-legacy-ui"})
              instant: true
              refId: D
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: math
              expression: "$A + $B + $D > 0"
              refId: C

      - uid: fineract_host_disk_low
        title: HostDiskLow
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Root filesystem free space below 15%
        labels:
          severity: warning
          service: host
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) < 0.15
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B

      - uid: fineract_host_mem_low
        title: HostMemLow
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Host available memory below 10%
        labels:
          severity: warning
          service: host
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B

      - uid: fineract_tenant_https_down
        title: TenantHttpsDown
        condition: B
        for: 3m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Public HTTPS probe failed for a tenant hostname
        labels:
          severity: critical
          service: fineract
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: probe_success{job="blackbox-https"} == 0
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B

      - uid: fineract_api_down
        title: FineractApiDown
        condition: B
        for: 3m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Public /fineract-provider API probe failed for a tenant
        labels:
          severity: critical
          service: fineract
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: min(probe_success{job="blackbox-api",probe_type="public_api"}) < 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B

      - uid: fineract_backup_stale
        title: BackupFailedOrStale
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: Nightly GDrive backup failed or is older than 36 hours
        labels:
          severity: warning
          service: backup
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: fineract_backup_success == 0
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: (time() - fineract_backup_last_success_unixtime) > 129600
              instant: true
              refId: B
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: math
              expression: "$A > 0 || $B > 0"
              refId: C

      - uid: fineract_log_errors
        title: FineractLogErrors
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Elevated ERROR lines in fineract-legacy-app logs
        labels:
          severity: warning
          service: fineract
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: sum(count_over_time({container="fineract-legacy-app"} |= `ERROR` [5m])) > 25
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
