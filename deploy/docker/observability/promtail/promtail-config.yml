server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(fineract-legacy-.*|fineract-obs-.*)"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - target_label: env
        replacement: production
    pipeline_stages:
      # Unwrap Docker JSON log frames so the full app line is stored in Loki
      - docker: {}
      # Extract common log levels (Spring/Logback and plain text)
      - regex:
          expression: '(?i)(?P<level>\b(?:ERROR|WARN(?:ING)?|INFO|DEBUG|TRACE|FATAL)\b)'
      - labels:
          level:
