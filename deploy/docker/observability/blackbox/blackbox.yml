modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 301, 302]
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: true
      # Wildcard cert chain not in public trust store used by blackbox image
      tls_config:
        insecure_skip_verify: true
      preferred_ip_protocol: ip4

  http_tomcat_api:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      # 401 = API up (auth required); 400 = tenant header missing but Tomcat responded
      valid_status_codes: [200, 400, 401, 403]
      method: GET
      follow_redirects: false
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: true
      preferred_ip_protocol: ip4
