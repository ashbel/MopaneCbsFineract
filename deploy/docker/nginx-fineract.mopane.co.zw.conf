# Install as /etc/nginx/sites-available/fineract (symlink in sites-enabled).
# Proxies TLS hostname fineract.mopane.co.zw to legacy Docker stack:
#   API  -> 127.0.0.1:8085 (Tomcat / fineract-provider)
#   UI   -> 127.0.0.1:3000 (fineract-legacy-ui nginx)

server {
    listen 80;
    listen [::]:80;
    server_name fineract.mopane.co.zw;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fineract.mopane.co.zw;

    ssl_certificate     /etc/ssl/mopane/fullchain.pem;
    ssl_certificate_key /etc/ssl/mopane/wildcard.nopass.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /fineract-provider/ {
        proxy_pass http://127.0.0.1:8085/fineract-provider/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # Community-app UI (fineract-legacy-ui). If UI is down, API under /fineract-provider still works.
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
