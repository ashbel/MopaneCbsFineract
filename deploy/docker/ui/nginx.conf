server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Missing static assets must 404 — never SPA-fallback to index.html
    # (that yields text/html MIME errors for require.js / CSS).
    location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|webp)$ {
        try_files $uri =404;
    }

    # SPA fallback only for application routes (no file extension)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
