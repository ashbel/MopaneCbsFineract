# Builds the provider war and runs the unit test suite on the JDK the project
# targets. src/integrationTest is deliberately not run here: it needs a deployed
# server and a MySQL tenant, neither of which exists on a runner.
name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK 21 build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Handles the Gradle user home cache and the daemon lifecycle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew test bootWar

      # The reports are the only way to see which assertion failed, and the run
      # that produced them is gone once the job ends.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
          if-no-files-found: ignore
