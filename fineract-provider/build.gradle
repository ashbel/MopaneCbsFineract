plugins {
    id 'java'
    id 'war'
    id 'eclipse'
    id 'idea'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '10.22.0'
    id 'com.github.hierynomus.license' version '0.16.1'
    id 'pmd'
    id 'com.github.spotbugs' version '6.0.26'
}

description = 'Apache Fineract Platform'

group = 'org.apache.fineract'
version = qualifyVersionIfNecessary('17.07.01.RELEASE')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

buildDir = new File(rootProject.projectDir, "../build")

repositories {
    mavenCentral()
    maven { url uri("${rootProject.projectDir}/pentaho-m2-local") }
}

// Version properties
ext {
    springBootVersion = '3.4.1'
    hibernateVersion = '6.6.3.Final'
    jakartaPersistenceApiVersion = '3.2.0'
    jakartaAnnotationApiVersion = '3.0.0'
    jakartaServletApiVersion = '6.1.0'
    jakartaValidationApiVersion = '3.1.0'
    jerseyVersion = '3.1.9'
    flywayVersion = '10.22.0'
    mysqlConnectorVersion = '8.4.0'
    guavaVersion = '33.4.0-jre'
    gsonVersion = '2.11.0'
    quartzVersion = '2.5.0'
    ehcacheVersion = '3.10.8'
    poiVersion = '5.3.0'
    awsSdkVersion = '2.29.31'
    jodaTimeVersion = '2.13.0'
    commonsEmailVersion = '1.6.0'
    commonsLang3Version = '3.17.0'
    retrofitVersion = '2.11.0'
    okhttpVersion = '4.12.0'
    activeMqVersion = '6.1.4'
    tikaVersion = '2.9.2'
}

configurations {
    all {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // implementation 'org.springframework.boot:spring-boot-starter-jms' // Comment out for now
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    
    // Spring Security OAuth2
    implementation 'org.springframework.security:spring-security-oauth2-authorization-server:1.4.0'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    
    // Jakarta EE APIs
    implementation "jakarta.persistence:jakarta.persistence-api:${jakartaPersistenceApiVersion}"
    implementation "jakarta.annotation:jakarta.annotation-api:${jakartaAnnotationApiVersion}"
    implementation "jakarta.servlet:jakarta.servlet-api:${jakartaServletApiVersion}"
    implementation "jakarta.validation:jakarta.validation-api:${jakartaValidationApiVersion}"
    implementation 'jakarta.mail:jakarta.mail-api:2.1.3'
    runtimeOnly 'org.eclipse.angus:angus-mail:2.0.3'
    
    // Hibernate
    implementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"
    implementation "org.hibernate.orm:hibernate-envers:${hibernateVersion}"
    
    // JAX-RS / Jersey (for migration period)
    implementation "org.glassfish.jersey.core:jersey-server:${jerseyVersion}"
    implementation "org.glassfish.jersey.containers:jersey-container-servlet:${jerseyVersion}"
    implementation "org.glassfish.jersey.media:jersey-media-json-jackson:${jerseyVersion}"
    implementation "org.glassfish.jersey.media:jersey-media-multipart:${jerseyVersion}"
    implementation "org.glassfish.jersey.ext:jersey-spring6:${jerseyVersion}"
    implementation "org.glassfish.jersey.inject:jersey-hk2:${jerseyVersion}"
    
    // Database
    implementation "com.mysql:mysql-connector-j:${mysqlConnectorVersion}"
    runtimeOnly "com.mysql:mysql-connector-j:${mysqlConnectorVersion}"
    
    // Flyway
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-mysql:${flywayVersion}"
    
    // Utilities
    implementation "com.google.guava:guava:${guavaVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"
    implementation "joda-time:joda-time:${jodaTimeVersion}"
    implementation "org.apache.commons:commons-email:${commonsEmailVersion}"
    implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"
    
    // HTTP clients
    implementation "com.squareup.retrofit2:retrofit:${retrofitVersion}"
    implementation "com.squareup.retrofit2:converter-gson:${retrofitVersion}"
    implementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"
    
    // Scheduler
    implementation "org.quartz-scheduler:quartz:${quartzVersion}"
    
    // Cache
    implementation "org.ehcache:ehcache:${ehcacheVersion}"
    implementation 'javax.cache:cache-api:1.1.1'
    
    // Apache POI for Excel
    implementation "org.apache.poi:poi:${poiVersion}"
    implementation "org.apache.poi:poi-ooxml:${poiVersion}"
    
    // Pentaho Reporting (optional - comment out if pentaho-m2-local not populated)
    // implementation 'pentaho-reporting-engine:pentaho-reporting-engine-classic-core:3.9.1.1'
    // implementation 'pentaho-reporting-engine:pentaho-reporting-engine-classic-extensions:3.9.1-GA'
    // implementation 'pentaho-reporting-engine:pentaho-reporting-engine-classic-extensions-scripting:3.9.1-GA'
    // implementation 'pentaho-reporting-engine:pentaho-reporting-engine-wizard-core:3.9.1-GA'
    // implementation 'pentaho-report-designer:pentaho-reporting-engine-wizard-xul:3.9.1-GA'
    // implementation 'pentaho-library:libbase:1.2.8'
    // implementation 'pentaho-library:libdocbundle:1.2.8'
    // implementation 'pentaho-library:libfonts:1.2.8'
    // implementation 'pentaho-library:libformat:1.2.8'
    // implementation 'pentaho-library:libformula:1.2.8'
    // implementation 'pentaho-library:libloader:1.2.8'
    // implementation 'pentaho-library:librepository:1.2.8'
    // implementation 'pentaho-library:libserializer:1.2.8'
    // implementation 'pentaho-library:libsparkline:1.2.8'
    // implementation 'pentaho-library:libxml:1.2.8'
    // implementation 'com.lowagie:itext:2.1.7'
    
    // AWS SDK
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'
    
    // ActiveMQ (commented out for now - requires spring-boot-starter-jms)
    // implementation "org.apache.activemq:activemq-broker:${activeMqVersion}"
    // implementation "org.apache.activemq:activemq-spring:${activeMqVersion}"
    
    // Tika
    implementation "org.apache.tika:tika-core:${tikaVersion}"
    
    // Calendar
    implementation 'org.mnode.ical4j:ical4j:1.0.4'
    
    // Mustache templating
    implementation 'com.github.spullara.mustache.java:compiler:0.9.14'
    
    // JSON Path
    implementation 'com.jayway.jsonpath:json-path:2.9.0'
    
    // Apache HTTP Client
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.1'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    testImplementation 'com.mockrunner:mockrunner-jms:2.0.7'
    testImplementation 'com.mockrunner:mockrunner-jdbc:2.0.7'
}

// Source sets for integration tests
sourceSets {
    integrationTest {
        java {
            srcDir 'src/integrationTest/java'
        }
        resources {
            srcDir 'src/integrationTest/resources'
        }
        compileClasspath += main.output + test.output
        runtimeClasspath += main.output + test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// Test configuration
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Integration test task
tasks.register('integrationTest', Test) {
    description = 'Run integration tests'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    
    shouldRunAfter test
    
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Flyway configuration
flyway {
    url = "jdbc:mysql://localhost:3306/mifostenant-default"
    driver = "com.mysql.cj.jdbc.Driver"
    user = project.hasProperty('mysqlUser') ? project.property('mysqlUser') : 'root'
    password = project.hasProperty('mysqlPassword') ? project.property('mysqlPassword') : 'mysql'
}

// Flyway tenant migration task
tasks.register('migrateTenantDB') {
    description = 'Migrates a Tenant DB. Optionally pass -PdbName=someTenantDBname'
    group = 'flyway'
    
    doLast {
        def filePath = "filesystem:$projectDir" + '/src/main/resources/sql/migrations/core_db'
        def tenantDbName = project.hasProperty('dbName') ? project.property('dbName') : 'mifostenant-default'
        
        flyway {
            url = "jdbc:mysql://localhost:3306/$tenantDbName"
            driver = "com.mysql.cj.jdbc.Driver"
            locations = [filePath]
            placeholderPrefix = "\$\${"
        }
        
        tasks.flywayMigrate.execute()
    }
}

// Flyway tenant list migration task
tasks.register('migrateTenantListDB') {
    description = 'Migrates a Tenant List DB. Optionally pass -PdbName=someDBname'
    group = 'flyway'
    
    doLast {
        def filePath = "filesystem:$projectDir" + '/src/main/resources/sql/migrations/list_db'
        def tenantsDbName = project.hasProperty('dbName') ? project.property('dbName') : 'mifosplatform-tenants'
        
        flyway {
            url = "jdbc:mysql://localhost:3306/$tenantsDbName"
            driver = "com.mysql.cj.jdbc.Driver"
            locations = [filePath]
        }
        
        tasks.flywayMigrate.execute()
    }
}

// PMD configuration
pmd {
    ignoreFailures = true
    sourceSets = [sourceSets.main]
}

// SpotBugs configuration (disabled for now during migration)
spotbugs {
    ignoreFailures = true
}

// Disable spotbugs tasks during initial migration
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    enabled = false
}

// License plugin configuration
license {
    header = rootProject.file('../APACHE_LICENSETEXT.md')
    excludes(["**/*.html", "**/*.mustache", "**/package-info.java", "**/keystore.jks"])
    strictCheck = true
    mapping {
        java = 'SLASHSTAR_STYLE'
    }
}

// WAR configuration
war {
    from('../licenses/binary/') {
        into 'WEB-INF/licenses/binary/'
    }
    from('../LICENSE_RELEASE') {
        into 'WEB-INF/'
        rename 'LICENSE_RELEASE', 'LICENSE'
    }
    from('../NOTICE_RELEASE') {
        into 'WEB-INF/'
        rename 'NOTICE_RELEASE', 'NOTICE'
    }
    from('../DISCLAIMER') {
        into 'WEB-INF/'
    }
}

// Spring Boot configuration
springBoot {
    mainClass = 'org.apache.fineract.ServerWithMariaDB4jApplication'
    buildInfo()
}

bootWar {
    enabled = true
    archiveFileName = 'fineract-provider.war'
}

// Distribution task
tasks.register('dist', Zip) {
    group = 'distribution'
    archiveBaseName = 'fineractplatform'
    archiveVersion = qualifyVersionIfNecessary('17.07.01.RELEASE')
    
    from('../') {
        include '*.md'
    }
    from('src/main/dist') {
        include '*'
    }
    from('../apps') {
        include '**/*'
        into 'apps'
    }
    from('src/main/pentahoReports/') {
        include '*'
        into 'pentahoReports'
    }
    from('../api-docs/') {
        include '*'
        into 'api-docs'
    }
    from('../fineract-db/') {
        include '*.sql'
        into 'database'
    }
    from('src/main/resources/sql/migrations') {
        include '**/*'
        into 'database/migrations'
    }
    from(war.outputs.files)
    
    into("${archiveBaseName.get()}-${archiveVersion.get()}")
}

// Deploy Pentaho reports task
tasks.register('deployPentahoReports', Copy) {
    group = 'application'
    description = 'Deploy Pentaho reports to user home directory'
    
    def pentahoReportDir = "${System.properties['user.home']}${File.separator}.mifosx${File.separator}pentahoReports"
    
    from 'src/main/pentahoReports'
    into pentahoReportDir
    
    doLast {
        println ":deployPentahoReports - moving pentaho reports to: ${pentahoReportDir}"
    }
}

// Version qualifier helper
def qualifyVersionIfNecessary(String version) {
    if (rootProject.hasProperty("BRANCH_NAME")) {
        def qualifier = rootProject.getProperty("BRANCH_NAME")
        if (qualifier.startsWith("MIFOSX-")) {
            return version.replace('BUILD', qualifier)
        }
    }
    return version
}

// Database tasks using SQL plugin (for createDB, dropDB tasks)
tasks.register('createDB') {
    group = 'database'
    description = 'Creates the Database. Pass -PdbName=someDBname'
    
    doLast {
        if (!project.hasProperty('dbName')) {
            throw new GradleException('Database name is required. Use -PdbName=someDBname')
        }
        println "Database creation should be done manually: CREATE DATABASE `${project.property('dbName')}`"
    }
}

tasks.register('dropDB') {
    group = 'database'
    description = 'Drops the specified database. Pass -PdbName=someDBname'
    
    doLast {
        if (!project.hasProperty('dbName')) {
            throw new GradleException('Database name is required. Use -PdbName=someDBname')
        }
        println "Database deletion should be done manually: DROP DATABASE `${project.property('dbName')}`"
    }
}
