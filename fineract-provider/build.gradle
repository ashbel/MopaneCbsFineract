war {
	from('../licenses/binary/') { // notice the parens
		into "WEB-INF/licenses/binary/" // no leading slash
	}
	from('../LICENSE_RELEASE') { // notice the parens
		into "WEB-INF/" // no leading slash
	}
	from('../NOTICE_RELEASE') { // notice the parens
		into "WEB-INF/" // no leading slash
	}
	rename ('LICENSE_RELEASE', 'LICENSE')
	rename ('NOTICE_RELEASE', 'NOTICE')
	
	from('../DISCLAIMER') { // notice the parens
		into "WEB-INF/" // no leading slash
	}
}





/* http://stackoverflow.com/questions/19653311/jpa-repository-works-in-idea-and-production-but-not-in-gradle */
sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory.get().asFile
sourceSets.test.output.resourcesDir = sourceSets.test.java.destinationDirectory.get().asFile

/* Exclude maria db and embedded tomcat related files for non dev builds */
if (!(project.hasProperty('env') && project.getProperty('env') == 'dev')) {
sourceSets {
    main {
        java {
            exclude '**/Server*'
            exclude '**/MariaDB4j*'
            exclude '**/EmbeddedTomcatWithSSLConfiguration.java'
        }
    }
    test {
    	java {
    		exclude '**/core/boot/tests/**'
    	}
    }
}
}

sourceSets {
 integrationTest {
    	compileClasspath += main.output + test.output
        runtimeClasspath += main.output + test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom runtimeOnly
}

task integrationTest(type:Test){
    description = "Run integration tests (located in src/integrationTest/java). Starts tomcat in daemon mode before executing the tests."
    it.dependsOn war

    testClassesDirs = project.sourceSets.integrationTest.output.classesDirs
    classpath = project.sourceSets.integrationTest.runtimeClasspath
}


import groovy.sql.Sql

repositories {
    mavenCentral()
}
configurations {
    driver
}
dependencies {
    driver 'com.mysql:mysql-connector-j:8.4.0'
}

/* No includeTestsMatching filter here. The old build ran one test class, which is
   how a Java 8 -> 21 move could look green while most of the suite never compiled
   or ran. Everything under src/test now runs; core/boot/tests stays excluded from
   the non-dev source set because it needs MariaDB4j. */
test {
    testLogging {
        events 'failed'
        exceptionFormat 'short'
    }
}

URLClassLoader loader = GroovyObject.class.classLoader
configurations.driver.each {File file ->
    loader.addURL(file.toURI().toURL())
}

task createDB {
    description = "Creates the Database. Needs database name to be passed (like: -PdbName=someDBname)"
    doLast {
        def sql = Sql.newInstance( 'jdbc:mysql://localhost:3306/', mysqlUser, mysqlPassword, 'com.mysql.cj.jdbc.Driver' )
        sql.execute( 'create database '+"`$dbName`" )
    }
}

task dropDB {
    description = "Drops the specified database. The database name has to be passed (like: -PdbName=someDBname)"
    doLast {
        def sql = Sql.newInstance( 'jdbc:mysql://localhost:3306/', mysqlUser, mysqlPassword, 'com.mysql.cj.jdbc.Driver' )
        sql.execute( 'DROP DATABASE '+"`$dbName`")
    }
}
task setBlankPassword {
    doLast {
        def sql = Sql.newInstance( 'jdbc:mysql://localhost:3306/', mysqlUser, mysqlPassword, 'com.mysql.cj.jdbc.Driver' )
        sql.execute('USE `mifosplatform-tenants`')
        sql.execute('UPDATE mifosplatform-tenants.tenants SET schema_server = \'localhost\', schema_server_port = \'3306\', schema_username = \'mifos\', schema_password = \'mysql\' WHERE id=1;')
    }
}

flyway {
    url = "jdbc:mysql://localhost:3306/mifostenant-default"
    driver = "com.mysql.cj.jdbc.Driver"
    user = mysqlUser
    password = mysqlPassword
    // Stretchy report SQL uses ${...}. Do not let Flyway treat that as a placeholder.
    placeholderPrefix = 'X{'
}

def configureFlyway = { String defaultName, String migrationsDir ->
    def dbName = rootProject.hasProperty("dbName") ? rootProject.getProperty("dbName") : defaultName
    flyway.url = "jdbc:mysql://localhost:3306/${dbName}"
    flyway.driver = "com.mysql.cj.jdbc.Driver"
    flyway.locations = ["filesystem:${projectDir}/src/main/resources/sql/migrations/${migrationsDir}"]
    flyway.placeholderPrefix = 'X{'
}

task migrateTenantDB {
    description = "Migrates a Tenant DB. Optionally pass -PdbName=someTenantDBname"
    finalizedBy 'flywayMigrate'
    doFirst { configureFlyway('mifostenant-default', 'core_db') }
}

task showTenantDBInfo {
    description = "Shows the migration info for a Tenant DB. Optionally pass -PdbName=someTenantDBname"
    finalizedBy 'flywayInfo'
    doFirst { configureFlyway('mifostenant-default', 'core_db') }
}

task migrateTenantListDB {
    description = "Migrates a Tenant List DB. Optionally pass -PdbName=someDBname"
    finalizedBy 'flywayMigrate'
    doFirst { configureFlyway('mifosplatform-tenants', 'list_db') }
}

task showTenantListDBInfo {
    description = "Shows the migration info for a List DB. Optionally pass -PdbName=someDBname"
    finalizedBy 'flywayInfo'
    doFirst { configureFlyway('mifosplatform-tenants', 'list_db') }
}

task repairTenantDB {
    description = "Recalculate Flyway checksums after the schema_version cutover"
    finalizedBy 'flywayRepair'
    doFirst { configureFlyway('mifostenant-default', 'core_db') }
}

/*
* Support publication of artifacts versioned by topic branch.
* CI builds supply `-P BRANCH_NAME=<TOPIC>` to gradle at build time.
* If <TOPIC> starts with 'MIFOSX-', change version
* from BUILD-SNAPSHOT => <TOPIC>-SNAPSHOT
* e.g. 1.1.0.BUILD-SNAPSHOT => 1.0.0.MIFOSX-1234-SNAPSHOT
*/
def qualifyVersionIfNecessary(version) {

	if (rootProject.hasProperty("BRANCH_NAME")) {
		def qualifier = rootProject.getProperty("BRANCH_NAME")
		if (qualifier.startsWith("MIFOSX-")) {
			return version.replace('BUILD', qualifier)
		}
	}
	return version
}

springBoot {
    mainClass = 'org.apache.fineract.ServerWithMariaDB4jApplication'
}
