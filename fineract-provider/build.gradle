plugins {
  id 'java'
  id 'war'
  id 'eclipse'
  id 'idea'
  id 'project-report'
  id 'org.springframework.boot' version '3.4.5'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.flywaydb.flyway' version '10.22.0'
}

description = '''\
Run as:
./gradlew bootWar
'''

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

/* Java 21 bytecode. Spring Boot 3.4 is the supported line for this JDK. */
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

project.ext.springBootVersion = '3.4.5'
project.ext.springVersion = '6.2.5'
project.ext.springOauthVersion = '6.4.4'
project.ext.jerseyVersion = '3.1.10'
project.ext.springDataJpaVersion = '3.4.5'

project.ext.mysqlUser='root'
project.ext.mysqlPassword='mysql'


group = 'org.apache.fineract'
buildDir = new File(rootProject.projectDir, "../build")
repositories {
	mavenCentral()
}


configurations.configureEach {
	exclude group: 'commons-logging'
	exclude module: 'hibernate-entitymanager'
	exclude module: 'hibernate-core'
	exclude module: 'bcmail-jdk14'
	exclude module: 'bcprov-jdk14'
	exclude module: 'bctsp-jdk14'
	exclude module: 'bval-core'
	exclude module: 'org.apache.bval.bundle'
	exclude module: 'bval-jsr303'
	exclude module: 'c3p0'
	exclude module: 'classworlds'
	exclude module: 'jcl-over-slf4j'
	exclude module: 'jul-to-slf4j'
	exclude module: 'serp'
	/* EclipseLink drags in the XJC schema compiler, whose jaxb-core is published
	   under com.sun.xml.bind with the same file name as the org.glassfish.jaxb one
	   from jaxb-runtime. Two jaxb-core-4.0.5.jar entries break bootWar, and neither
	   XJC artifact is used at runtime. */
	exclude group: 'com.sun.xml.bind', module: 'jaxb-xjc'
	exclude group: 'com.sun.xml.bind', module: 'jaxb-core'
	/* mockrunner drags in nekohtml -> xerces 2.4.0, which wins the JAXP lookup on
	   the test classpath and then fails loading org.w3c.dom.ls.DocumentLS, a class
	   the java.xml module does not have. Spring cannot parse any bean XML while it
	   is present. Nothing needs a standalone parser on Java 21. */
	exclude group: 'xerces'
	exclude group: 'nekohtml'
}
/* Pick up dependencies based on the environemnt, defaults to production */
if (project.hasProperty('env') && project.getProperty('env') == 'dev') {
    apply from:  'dev-dependencies.gradle'
}  else {
    apply from: 'dependencies.gradle'
}

/* Enable Oauth2 authentication based on environment, default to HTTP basic auth */
if (project.hasProperty('security') && project.getProperty('security') == 'oauth') {
    if(project.hasProperty('twofactor') && project.getProperty('twofactor') == 'enabled') {
        copy {
            from './properties/oauth/twofactor/'
            into 'src/main/resources/'
            include '*.properties'
        }
    } else {
        copy {
            from './properties/oauth/'
            into 'src/main/resources/'
            include '*.properties'
        }
    }
}  else {
    if(project.hasProperty('twofactor') && project.getProperty('twofactor') == 'enabled') {
        copy {
            from './properties/basicauth/twofactor/'
            into 'src/main/resources/'
            include '*.properties'
        }
    } else {
        copy {
            from './properties/basicauth/'
            into 'src/main/resources/'
            include '*.properties'
        }
    }
}

task dist(type:Zip){
	def distVersion = qualifyVersionIfNecessary(releaseVersion)
	archiveBaseName = 'fineractplatform'
	archiveVersion = distVersion
    includeEmptyDirs = true
	from('../') {
		fileMode = 0755
		include '*.md'
	}
    from('src/main/dist') {
        fileMode = 0755
        include '*'
    }
	from('../apps') {
		fileMode = 0755
        include '**/*'
		into('apps')
	}
	from('src/main/resources/reports/jasper/') {
        fileMode = 0644
        include '*.jrxml'
        into('jasperReports')
    }
    from('../api-docs/') {
        fileMode = 0755
        include '*'
        into('api-docs')
    }
    from('../fineract-db/') {
        fileMode = 0755
        include '*.sql'
        into('database')
    }
    from('src/main/resources/sql/migrations') {
        fileMode = 0755
        include '**/*'
        into('database/migrations')
    }
    
    from war.outputs.files
    into('fineractplatform-' + distVersion)
}

task deployPentahoReports() {
    doLast {
        println ':deployPentahoReports - Jasper templates are on the classpath at reports/jasper'
    }
}

